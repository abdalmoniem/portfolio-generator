[project]
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
name = "Portfolio_Generator"
authors = [{ name = "AbdElMoniem ElHifnawy", email = "abdalmoniemalhifnawy@gmail.com" }]
description = "A Python package to generate a portfolio website, resume, and PDF from a JSON configuration file."
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "json5>=0.9.0",
  "rich>=15.0.0",
  "dacite>=1.9.2",
  "jinja2>=3.1.6",
  "weasyprint>=60.0",
  "livereload>=2.7.1",
]
